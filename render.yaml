services:
  - type: web
    name: my-app-backend
    env: node
    region: oregon # or choose another region
    buildCommand: npm install --include=dev && npm run server:build
    startCommand: npm run server:prod
    envVars:
      - key: DATABASE_URL
        sync: false # will be set manually in Render dashboard
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/products
    autoDeploy: true
